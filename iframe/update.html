<!doctype html>
<html lang="zh-Hans">
	<head>
		<title id="pageTitle"></title>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="/iframe/style/update.css" />
		<script>
			var edaObj = (typeof eda !== 'undefined') ? eda : (window.parent && window.parent.eda);
			function t(tag, ...args) {
				if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
				return tag;
			}
		</script>
		<script src="/iframe/update.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	</head>
	<body>
		<p id="descText"></p>
		<div id="sch">
			<p id="currentSchLabel"></p>
			<select name="test" id="select1">
				<option value="" id="loadingOpt"></option>
			</select>
		</div>
		<div id="value">
			<p id="baseAttrLabel"></p>
			<select name="test" id="select2">
				<option value="" disabled selected id="selectPlaceholder1"></option>
				<option value="device" id="optDeviceName"></option>
				<option value="Part Number" id="optPartNumber1"></option>
				<option value="Manufacturer Part" id="optManufacturerPart1"></option>
				<option value="Supplier Part" id="optSupplierPart1"></option>
				<option value="Value" id="optValue1"></option>
			</select>
		</div>
		<div id="library">
			<p id="libraryLabel"></p>
			<select name="test" id="select3"></select>
		</div>
		<div id="value2">
			<p id="matchAttrLabel"></p>
			<select name="test" id="select4">
				<option value="" disabled selected id="selectPlaceholder2"></option>
				<option value="display_title" id="optDeviceName2"></option>
				<option value="Part Number" id="optPartNumber2"></option>
				<option value="Manufacturer Part" id="optManufacturerPart2"></option>
				<option value="Supplier Part" id="optSupplierPart2"></option>
				<option value="Value" id="optValue2"></option>
			</select>
		</div>
		<p id="hintText"></p>
		<p id="warnText"></p>
		<div id="progressPanel" class="hidden">
			<div id="progressText"></div>
			<div id="progressBarTrack"><div id="progressBar"></div></div>
			<div id="progressStats">
				<span id="totalLabel"></span>
				<span id="successLabel"></span>
				<span id="failedLabel"></span>
			</div>
		</div>
		<div id="Choose">
			<button id="startbutton"></button>
			<button id="resultbutton" disabled></button>
			<button id="closebutton"></button>
		</div>
		<script>
			document.getElementById('pageTitle').textContent = t('Title_DeleteAndReplace');
			document.getElementById('descText').textContent = t('Desc_DeleteAndReplace');
			document.getElementById('currentSchLabel').textContent = t('Title_CurrentSchematic');
			document.getElementById('loadingOpt').textContent = t('Opt_Loading');
			document.getElementById('baseAttrLabel').textContent = t('Title_SelectBaseAttr');
			document.getElementById('selectPlaceholder1').textContent = t('Opt_SelectPlaceholder');
			document.getElementById('optDeviceName').textContent = t('Opt_DeviceName');
			document.getElementById('optPartNumber1').textContent = t('Opt_PartNumber');
			document.getElementById('optManufacturerPart1').textContent = t('Opt_ManufacturerPart');
			document.getElementById('optSupplierPart1').textContent = t('Opt_SupplierPart');
			document.getElementById('optValue1').textContent = t('Opt_Value');
			document.getElementById('libraryLabel').textContent = t('Title_SelectLibrary');
			document.getElementById('matchAttrLabel').textContent = t('Title_SelectMatchAttr');
			document.getElementById('selectPlaceholder2').textContent = t('Opt_SelectPlaceholder');
			document.getElementById('optDeviceName2').textContent = t('Opt_DeviceName');
			document.getElementById('optPartNumber2').textContent = t('Opt_PartNumber');
			document.getElementById('optManufacturerPart2').textContent = t('Opt_ManufacturerPart');
			document.getElementById('optSupplierPart2').textContent = t('Opt_SupplierPart');
			document.getElementById('optValue2').textContent = t('Opt_Value');
			document.getElementById('hintText').textContent = t('Hint_SupportedAttrs');
			document.getElementById('warnText').textContent = t('Warn_BackupProject');
			document.getElementById('progressText').textContent = t('Progress_Ready');
			document.getElementById('totalLabel').innerHTML = t('Label_Total') + ' <b id="totalCount">0</b>';
			document.getElementById('successLabel').innerHTML = t('Label_Success') + ' <b id="successCount">0</b>';
			document.getElementById('failedLabel').innerHTML = t('Label_Failed') + ' <b id="failedCount">0</b>';
			document.getElementById('startbutton').textContent = t('Btn_Update');
			document.getElementById('resultbutton').textContent = t('Btn_ViewResults');
			document.getElementById('closebutton').textContent = t('Btn_Cancel');
			document.getElementById('warnText').textContent = t('Warn_BackupProjectDeleteReplace');
		</script>
	</body>
</html>
